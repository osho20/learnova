name: learnova
description: AI-Powered Student Productivity App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  hive_flutter: ^1.1.0
  dio: ^5.4.1
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  fl_chart: ^0.67.0
  image_picker: ^1.0.7
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.2.2
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3
  sqflite: ^2.3.2
  path: ^1.8.3
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^16.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
